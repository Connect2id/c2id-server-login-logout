# ===================================================================
# Spring Boot configuration for the "dev" profile.
#
# This configuration overrides the application.yml file.
# ===================================================================

gg:
    jte:
        # Load and compile the source templates on demand in development.
        templateLocation: src/main/jte
        developmentMode: true
        usePrecompiledTemplates: false

# ===================================================================
# To enable SSL, generate a certificate using:
# keytool -genkey -alias c2idlogin -storetype PKCS12 -keyalg RSA -keysize 2048 -keystore keystore.p12 -validity 3650
#
# Then, modify the server.ssl properties so that your "server" configuration looks like:
#
# server:
#    port: 8443
#    ssl:
#        key-store: keystore.p12
#        key-store-password: <your-password>
#        keyStoreType: PKCS12
#        keyAlias: c2idlogin
# ===================================================================
server:
    port: 8000
    servlet:
      context-path: /c2id-login

spring:
    security:
        oauth2:
          client:
            registration:
              google:
                provider: Google
                client-id: 4711250984-l7rtg7bkqsk8rolvg4tcdll5ciff0dfc.apps.googleusercontent.com
                client-secret: Hdbo2Kp_Ja7uFT2-2TNKtISM
                authorization-grant-type: authorization_code
                scope: openid, profile, email
                redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            provider:
              google:
                user-name-attribute: sub
                issuer-uri: https://google.com
    web:
        resources:
            cache:
                period: 0s
                cachecontrol:
                    no-cache: true
                    no-store: true
                    must-revalidate: true

