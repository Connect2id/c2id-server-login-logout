# ===================================================================
# Spring Boot configuration for the "prod" profile.
#
# This configuration overrides the application.yml file.
# ===================================================================

gg:
    jte:
        # Use the templates precompiled by the jte-maven-plugin
        templateLocation: src/main/jte
        developmentMode: false
        usePrecompiledTemplates: true

# ===================================================================
# To enable SSL, generate a certificate using:
# keytool -genkey -alias c2idlogin -storetype PKCS12 -keyalg RSA -keysize 2048 -keystore keystore.p12 -validity 3650
#
# Then, modify the server.ssl properties so that your "server" configuration looks like:
#
# server:
#    port: 443
#    ssl:
#        key-store: keystore.p12
#        key-store-password: <your-password>
#        keyStoreType: PKCS12
#        keyAlias: c2idlogin
# ===================================================================
server:
    port: 8080
    servlet:
      context-path: /c2id-login-logout
    compression:
        enabled: true
        mime-types: text/html,text/xml,text/plain,text/css, application/javascript, application/json
        min-response-size: 1024







